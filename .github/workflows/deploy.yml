name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish ./LiveTrackerHovedopgave/LiveTrackerHovedopgave.csproj -c Release -r win-x86 --self-contained true -o publish

      - uses: RasmusBuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.hovedopgavelivetracker.dk }}
          server-computer-name: ${{ secrets.mssql2.unoeuro.com }}
          server-username: ${{ secrets.hovedopgavelivetracker_dk}}
          server-password: ${{ secrets.dAycekabtRzhmFgH29pw }}
          source-path: '\publish\'
